# 在 runner 上把上游 main 合并进本仓库，冲突只允许出现在 l10n 生成物上，
# 这些文件交给 app/tool/l10n_merge.py 从 parts 重建。结果推到独立分支，不动现有分支。
#
# 手动：Actions › Merge upstream › Run workflow
# 定时：每天 04:00 (UTC+8) 自动试合并到 merge/upstream-auto，只为看起来得及，
#       不会自己出包；出包仍是 Build APK 那一步。
name: Merge upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游分支'
        required: true
        default: 'main'
      target_branch:
        description: '合并结果推送到的分支'
        required: true
        default: 'merge/upstream'
      version:
        description: '版本名（空则保留上游的）；build number 始终由构建脚本按分钟给出'
        required: false
        default: ''
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  # schedule 触发时 inputs 为空，这里给出与手动默认值一致的兜底。
  UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
  TARGET_BRANCH: ${{ inputs.target_branch || 'merge/upstream-auto' }}
  VERSION: ${{ inputs.version || '' }}

concurrency:
  group: merge-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 上游会改 .github/workflows/*，GITHUB_TOKEN 没有 workflows 权限推不上去，
          # 这里用仓库 secret PUSH_TOKEN（PAT，含 workflow scope）。
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git
          git fetch --no-tags upstream "$UPSTREAM_REF"
          echo "upstream tip: $(git rev-parse --short "upstream/$UPSTREAM_REF")"
          echo "base tip:     $(git rev-parse --short HEAD)"

      - name: Merge upstream
        run: |
          set +e
          git config user.name "dsh-merge-bot"
          git config user.email "merge-bot@users.noreply.github.com"
          git merge --no-ff --no-commit "upstream/$UPSTREAM_REF"
          echo "merge exit: $?"

          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          echo "===== CONFLICTED ====="
          cat /tmp/conflicts.txt

          rm -f /tmp/unresolved.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              app/lib/l10n/app_*.arb|app/lib/l10n/gen/*)
                git checkout --theirs -- "$f"
                git add -- "$f"
                echo "regenerate later: $f"
                ;;
              # 上游也会动 pubspec.yaml；取上游为准，版本号在下一步统一设置。
              app/pubspec.yaml)
                git checkout --theirs -- "$f"
                git add -- "$f"
                echo "take upstream, version set below: $f"
                ;;
              # 上游这处 onError 参数名仍是 `__`，会触发 unnecessary_underscores
              # 让 dsh_remote 的 dart analyze 失败；取上游改动后就地修掉。
              packages/dsh_remote/lib/src/dsh_web.dart)
                git checkout --theirs -- "$f"
                sed -i -E "s/StackTrace __\)/StackTrace _)/" "$f"
                git add -- "$f"
                echo "take upstream, underscore fixed: $f"
                ;;
              *)
                echo "$f" >> /tmp/unresolved.txt
                ;;
            esac
          done < /tmp/conflicts.txt

          if [ -s /tmp/unresolved.txt ]; then
            echo "::error::存在无法自动解决的冲突，需要人工合并："
            cat /tmp/unresolved.txt
            exit 1
          fi
          echo "所有冲突都是可重建的生成物或 pubspec，将由后续步骤处理。"

      - name: Set version
        if: env.VERSION != ''
        run: |
          sed -i -E "s/^version: .*/version: ${VERSION}+1/" app/pubspec.yaml
          # 编译期兜底的版本号要和 pubspec 一致（tooling/test_build_number.py 会查）。
          sed -i -E "s/(String\.fromEnvironment\('DSH_APP_VERSION', defaultValue: ')[^']*('\))/\1${VERSION}+1\2/" app/lib/state/app_info.dart
          # 指南文档第 3 行的版本横幅跟着走，否则 "Generated files" 检查会失败。
          for f in docs/guide/README.md docs/guide/harmony/README.md; do
            [ -f "$f" ] || continue
            sed -i -E "s/^> dsh-go .*/> dsh-go ${VERSION}/" "$f"
          done
          grep -n '^version:' app/pubspec.yaml
          grep -n 'DSH_APP_VERSION' app/lib/state/app_info.dart | head -3
          grep -rn '^> dsh-go ' docs/guide --include=README.md | head -5

      - name: Resync guide skill assets
        if: env.VERSION != ''
        run: |
          # 随包分发的 dsh-go-guide 素材是 docs/guide 的副本，版本横幅变了必须重写，
          # 否则 "Generated files" 与 guide_skill_test 都会红。
          python3 app/tool/guide_sync.py
          git status --short -- app/assets/skills/dsh-go-guide | head -20

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Rebuild l10n from parts
        working-directory: app
        run: |
          flutter pub get
          python3 tool/l10n_merge.py
          echo "===== l10n diff stat ====="
          git -C .. diff --stat -- lib/l10n | tail -20

      - name: Analyze
        working-directory: app
        continue-on-error: true
        run: |
          flutter analyze --no-pub 2>&1 | tail -60

      # 设置页会随上游新增行，截图基准必然过期；在合并结果上重渲染，
      # 让 CI 的 golden 检查继续有意义，而不是一路红灯。
      - name: Restore golden fonts
        id: fonts
        uses: actions/cache/restore@v4
        with:
          path: ~/test-fonts
          key: test-fonts-1:20230817+repack1-3-v2.051

      - name: Download golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk="1:20230817+repack1-3" fonts-noto-cjk-extra="1:20230817+repack1-3"
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" unpacked; done
          mkdir -p ~/test-fonts
          cp unpacked/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc ~/test-fonts/
          curl -fsSL --retry 3 -o ~/test-fonts/NotoColorEmoji.ttf "https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf"

      - name: Save golden fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/test-fonts
          key: ${{ steps.fonts.outputs.cache-primary-key }}

      - name: Install golden fonts
        run: |
          sudo install -Dm644 -t /usr/share/fonts/opentype/noto ~/test-fonts/NotoSansCJK-*.ttc
          sudo install -Dm644 ~/test-fonts/NotoColorEmoji.ttf /usr/share/fonts/noto/NotoColorEmoji.ttf

      - name: Re-render settings goldens
        working-directory: app
        continue-on-error: true
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
        run: |
          flutter test --no-pub --update-goldens --concurrency=2 --reporter github test/shell/shell_golden_test.dart 2>&1 | tail -20

      - name: Commit merge
        run: |
          git add -A
          git commit --no-verify -m "merge: 同步上游 $UPSTREAM_REF ($(git rev-parse --short "upstream/$UPSTREAM_REF"))，l10n 由 parts 重建" || echo "nothing to commit"
          git log --oneline -1

      - name: Push result branch
        run: |
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" --force
          echo "pushed to $TARGET_BRANCH"
